{% extends 'base.html' %}

{% block title %}Mapa - Soundtrack Map{% endblock %}

{% block content %}
<!-- Importando o CSS e JS do Leaflet.js -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="app-layout">
    <!-- Barra Superior -->
    <header class="topbar">
        <div class="logo">
            <h2>🎵 Soundtrack Map</h2>
        </div>
        <div class="user-info">
            <span>Olá, <strong>{{ user.name }}</strong>!</span>
            <a href="{{ url_for('auth.logout') }}" class="btn-logout">Sair</a>
        </div>
    </header>

    <!-- Container do Mapa -->
    <main class="map-container">
        <div id="map"></div>
    </main>
</div>

<script>
    // Inicializa o mapa centralizado no Brasil/Mundo
    // Coordenadas: [-14.2350, -51.9253] (Brasil), Zoom: 4
    const map = L.map('map').setView([-14.2350, -51.9253], 4);

    // Adiciona a camada de mapa do OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Adiciona um pino de teste inicial para ver a interatividade
    const marker = L.marker([-23.5505, -46.6333]).addTo(map); // São Paulo
    marker.bindPopup("<b>São Paulo 🎵</b><br>Seja bem-vindo ao Soundtrack Map!").openPopup();
</script>
{% endblock %}
